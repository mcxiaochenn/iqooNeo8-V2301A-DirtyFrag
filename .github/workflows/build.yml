name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI keystore
        working-directory: app
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci -keypass ci \
            -dname "CN=CI, OU=DirtyFrag, O=iQOO Neo8" > /dev/null 2>&1
          printf 'storeFile=ci-release.jks\nstorePassword=ci\nkeyAlias=ci\nkeyPassword=ci\n' > keystore.properties
          cat keystore.properties

      - name: Build debug APK
        working-directory: app
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: app
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/app/build/outputs/apk/debug/*.apk out/ || true
          cp app/app/build/outputs/apk/release/*.apk out/ || true
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iqooNeo8-dirtyfrag-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
